name: Verify and deploy Cloudflare

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.0'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build local application
        run: npm run build
      - name: Build Cloudflare Worker and frontend
        run: npm run build:cloudflare

  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: cloudflare-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_WORKERS_SUBDOMAIN: ${{ vars.CLOUDFLARE_WORKERS_SUBDOMAIN }}
    steps:
      - name: Check deployment credentials
        id: credentials
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            echo '::notice::Cloudflare deployment skipped: add the CLOUDFLARE_API_TOKEN repository secret.'
            echo '### Deployment skipped' >> "$GITHUB_STEP_SUMMARY"
            echo 'Verification passed. Add the CLOUDFLARE_API_TOKEN secret and Cloudflare account variables, then run this workflow again.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.credentials.outputs.configured == 'true'
      - uses: actions/setup-node@v4
        if: steps.credentials.outputs.configured == 'true'
        with:
          node-version: '24.22.0'
          cache: npm
      - run: npm ci
        if: steps.credentials.outputs.configured == 'true'
      - name: Deploy through Void
        if: steps.credentials.outputs.configured == 'true'
        env:
          NODE_OPTIONS: --import ./scripts/cloudflare-deploy-diagnostics.mjs
        run: npm run deploy:cloudflare
      - name: Preserve resource IDs and migration history
        if: always() && steps.credentials.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: void-resource-lock
          path: void.lock.json
          if-no-files-found: ignore
          retention-days: 30
